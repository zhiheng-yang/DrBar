# XcodeGen project: run `xcodegen generate` (or scripts/bootstrap.sh) to create DrBar.xcodeproj.
# The generated project is not committed; edit this file instead.
name: DrBar

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  DrBarKit:
    path: Packages/DrBarKit

settings:
  base:
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  DrBar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - DrBar.entitlements
    settings:
      base:
        PRODUCT_NAME: DrBar
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).DrBar
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DrBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - package: DrBarKit
        product: DrBarKit
      - package: DrBarKit
        product: CCFDDLKit
      - package: DrBarKit
        product: DrBarUI

schemes:
  DrBar:
    build:
      targets:
        DrBar: all
    run:
      config: Debug
      # Off by default; tick them in Edit Scheme › Run › Arguments.
      commandLineArguments:
        "-DrBarDemo YES": false
        "-AppleLanguages (zh-Hans)": false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
